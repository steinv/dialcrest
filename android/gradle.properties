org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true
# Kept false: Flutter plugins (firebase_*, cloud_functions, ...) still apply the
# legacy kotlin-android plugin, which is incompatible with AGP 9 built-in Kotlin.
# Together with newDsl=false this enables AGP 9's transitional legacy-KGP support.
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
